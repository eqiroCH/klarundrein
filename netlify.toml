[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Alte URLs der bisherigen Hostinger-Seite sauber weiterleiten (Google kennt sie evtl. schon)
[[redirects]]
  from = "/datenschutzerklarung"
  to = "/datenschutz"
  status = 301
[[redirects]]
  from = "/geschaftsbedingungen"
  to = "/"
  status = 301
[[redirects]]
  from = "/en/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
